    <script src="assets/js/app.js"></script>
    <script>
        // 移动端菜单切换
        document.getElementById('mobileMenuToggle').addEventListener('click', toggleSidebar);
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('sidebar-open');
            overlay.classList.toggle('overlay-show');
        }

        // 自动调整输入框高度
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        // 快速开始
        function quickStart(type) {
            const questions = {
                fund: '我想学习基金投资，应该从哪里开始？',
                stock: '我想学习股票投资，应该从哪里开始？',
                bond: '我想学习债券投资，应该从哪里开始？',
                beginner: '我是投资小白，完全不懂，应该怎么开始？'
            };
            sendMessage(questions[type]);
        }

        // 新对话
        function newChat() {
            const welcome = document.getElementById('welcomeScreen');
            const messages = document.getElementById('messagesContainer');
            
            if (messages) {
                messages.innerHTML = '';
                messages.style.display = 'none';
            }
            if (welcome) {
                welcome.style.display = 'flex';
            }
            
            // 移动端关闭侧边栏
            if (window.innerWidth <= 768) {
                toggleSidebar();
            }
            
            // 滚动到顶部
            const chatArea = document.getElementById('chatArea');
            if (chatArea) chatArea.scrollTop = 0;
        }
    </script>
